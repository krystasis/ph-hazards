name: collect

# 15 分ごと。GitHub の定期実行は混雑時に遅れる(10〜30 分)。間隔の下限は collector 側でも守っている。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# 前の回が終わっていなければ重ねない(取得元に二重で行かない)。
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        id: collect
        run: python3 -m collector.run
        continue-on-error: true  # 失敗しても取れた分と state(クールダウン等)は残す

      - name: Commit
        run: |
          git config user.name "ph-hazards-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi

      - name: 解析失敗・拒否があれば赤にする
        if: steps.collect.outcome == 'failure'
        run: exit 1
