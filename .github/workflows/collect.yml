name: collect

# 15 分ごと。GitHub の定期実行は混雑時に遅れる(10〜30 分)。間隔の下限は collector 側でも守っている。
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

# 前の回が終わっていなければ重ねない(取得元に二重で行かない)。
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Collect
        id: collect
        run: python3 -m collector.run
        continue-on-error: true  # 失敗しても取れた分と state(クールダウン等)は残す

      # 取れた分はここで確定させる。この後の D1 送信が失敗しても、データは残る。
      # 予備(Mac)と同じ分に push がぶつかったら、今回の分を捨てて origin/main に揃える(scripts/push_commit.sh)。
      - name: Commit
        run: scripts/push_commit.sh "data: $(date -u +%Y-%m-%dT%H:%MZ)" data state

      # 変わった行だけ D1 へ。secrets が無いフォークでは何もせずに 0 で終わる。
      # 1 日の書き込み上限に当たって止まるのも 0(失敗ではない)。
      - name: Send to D1
        id: d1
        continue-on-error: true  # 送れた分の manifest を必ず残してから赤くする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          D1_DAILY_BUDGET: "50000"   # 同じアカウントの opsboard の分を残す。過去分の投入が終わったら 60000 に戻してよい
        run: python3 -m db.send data

      # 送れたところまでの manifest と、その日に書いた行数。次の回がここから続ける。
      - name: Commit D1 state
        if: always()
        run: scripts/push_commit.sh "d1: $(date -u +%Y-%m-%dT%H:%MZ)" state/d1-manifest.json state/d1-usage.json

      - name: 解析失敗・拒否・D1 の失敗があれば赤にする
        if: steps.collect.outcome == 'failure' || steps.d1.outcome == 'failure'
        run: exit 1
